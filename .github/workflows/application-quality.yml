name: Application quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oku_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm audit --audit-level=moderate
      - run: npm run i18n:check
      - run: npm run lint
      - run: npx tsc --noEmit

  database-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: oku_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d oku_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oku_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --reporter=dot
      - name: Configure ephemeral build-only auth secret
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const { randomBytes } = require("node:crypto");
          process.stdout.write(`NEXTAUTH_SECRET=${randomBytes(32).toString("base64")}\\n`);
          NODE
      - run: npm run build
